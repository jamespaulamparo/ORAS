<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="timeyBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8faf8"/>
      <stop offset="100%" stop-color="#eef3ee"/>
    </radialGradient>
    <linearGradient id="sageAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b8f71"/>
      <stop offset="100%" stop-color="#4a6d50"/>
    </linearGradient>
    <filter id="timeyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4a6d50" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Cute Top Winder Ring (Sage green) -->
  <g id="topLoop">
    <ellipse cx="100" cy="26" rx="13" ry="10" fill="none" stroke="url(#sageAccent)" stroke-width="4"/>
    <rect x="95" y="32" width="10" height="8" rx="2.5" fill="url(#sageAccent)"/>
  </g>

  <!-- Huggable Baymax-style Round Soft Clock Body -->
  <ellipse cx="100" cy="115" rx="64" ry="62" fill="url(#timeyBody)" filter="url(#timeyShadow)"/>
  <ellipse cx="100" cy="115" rx="64" ry="62" fill="none" stroke="#dbe5dc" stroke-width="2"/>

  <!-- Subtle Minimal Dial Ring inside belly -->
  <circle cx="100" cy="118" r="48" fill="none" stroke="#e2ece3" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 4 Minimal Soft Hour Marks -->
  <circle cx="100" cy="74" r="2.5" fill="#6b8f71" opacity="0.6"/>
  <circle cx="144" cy="118" r="2.5" fill="#6b8f71" opacity="0.6"/>
  <circle cx="100" cy="162" r="2.5" fill="#6b8f71" opacity="0.6"/>
  <circle cx="56" cy="118" r="2.5" fill="#6b8f71" opacity="0.6"/>

  <!-- Rosy Soft Blushing Cheeks -->
  <ellipse cx="70" cy="114" rx="7" ry="4" fill="#f8b4be" opacity="0.55"/>
  <ellipse cx="130" cy="114" rx="7" ry="4" fill="#f8b4be" opacity="0.55"/>

  <!-- Baymax-Inspired Cute Simple Dot Eyes & Connecting Line -->
  <g id="baymaxEyes">
    <!-- Connecting horizontal bar -->
    <line x1="84" y1="104" x2="116" y2="104" stroke="#222831" stroke-width="2" stroke-linecap="round"/>
    <!-- Left simple dot eye -->
    <circle cx="84" cy="104" r="5" fill="#222831"/>
    <!-- Right simple dot eye -->
    <circle cx="116" cy="104" r="5" fill="#222831"/>
    <!-- Cute tiny white highlight in each eye -->
    <circle cx="82.5" cy="102.5" r="1.5" fill="#ffffff"/>
    <circle cx="114.5" cy="102.5" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Sweet Tiny Smile -->
  <path d="M96 116 Q100 120 104 116" fill="none" stroke="#222831" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Belly Clock Hands (Pointing peacefully to 10:10) -->
  <line x1="100" y1="138" x2="88" y2="131" stroke="url(#sageAccent)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="138" x2="113" y2="130" stroke="url(#sageAccent)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="138" r="2.5" fill="#4a6d50"/>

  <!-- Soft Huggable Baymax Nub Arms -->
  <!-- Left arm -->
  <ellipse cx="38" cy="120" rx="9" ry="14" fill="#ffffff" stroke="#dbe5dc" stroke-width="2" transform="rotate(18 38 120)"/>
  <!-- Right arm (waving softly) -->
  <g id="wavingArm" transform="rotate(-25 162 108)">
    <ellipse cx="162" cy="108" rx="9" ry="15" fill="#ffffff" stroke="#dbe5dc" stroke-width="2"/>
    <!-- Tiny soft wave lines -->
    <path d="M176 98 Q180 104 176 110" fill="none" stroke="#6b8f71" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Cute Rounded Feet -->
  <ellipse cx="82" cy="175" rx="10" ry="7" fill="#ffffff" stroke="#dbe5dc" stroke-width="2"/>
  <ellipse cx="118" cy="175" rx="10" ry="7" fill="#ffffff" stroke="#dbe5dc" stroke-width="2"/>
</svg>
