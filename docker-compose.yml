version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: schedule_planner_db
    environment:
      POSTGRES_DB: schedule_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
